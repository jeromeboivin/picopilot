[package]
name = "picopilot"
version = "0.1.0"
edition = "2021"
publish = false
description = "A minimalist Rust coding agent built on the GitHub Copilot SDK"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
github-copilot-sdk = "1.0.13-preview.2"
json5 = "0.4"
pulldown-cmark = "0.13"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
syntect = { version = "5.3.0", default-features = false, features = ["dump-load", "parsing", "regex-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
