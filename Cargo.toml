[package]
name = "picopilot"
version = "0.1.0"
edition = "2021"
publish = false
description = "A minimalist Rust coding agent built on the GitHub Copilot SDK"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
github-copilot-sdk = "1.0.13-preview.2"
ratatui = "0.29"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
